<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface Inteligência</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8faff; padding-top: 80px; }
        .main-title { font-weight: 700; color: #0d1b2a; margin-bottom: 60px; text-align: center; }
        
        /* --- DESKTOP CONFIG --- */
        @media (min-width: 768px) {
            .desktop-row { 
                display: flex; 
                align-items: center; /* Alinha os cards pelo centro verticalmente */
                justify-content: center;
                gap: 15px;
            }

            .card-intelligence {
                border: none;
                border-radius: 20px;
                background: white;
                text-align: center;
                cursor: pointer;
                transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                
                /* Altura padrão para cards inativos */
                height: 280px; 
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding: 20px;
                width: 100%;
            }

            /* Card Ativo: Fica maior (Altura e Zoom) */
            .card-intelligence.active {
                height: 350px; /* Altura maior que os outros */
                transform: scale(1.05);
                box-shadow: 0 20px 40px rgba(0,0,0,0.08);
                z-index: 10;
            }
        }

        /* --- MOBILE CONFIG (Accordion) --- */
        @media (max-width: 767px) {
            .desktop-row { display: none; }
            .mobile-accordion-item {
                background: white;
                border-radius: 12px;
                margin-bottom: 10px;
                box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            }
            .accordion-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
            .accordion-content { max-height: 0; overflow: hidden; transition: 0.3s ease-out; padding: 0 15px; }
            .mobile-accordion-item.active .accordion-content { max-height: 200px; padding-bottom: 20px; }
            .active .arrow { transform: rotate(180deg); transition: 0.3s; }
        }

        /* Cores e Ícones */
        .icon-lg { width: 60px; height: 60px; margin: 0 auto 15px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; }
        .bg-sales { background: linear-gradient(135deg, #ffb347, #ffcc33); }
        .bg-app { background: linear-gradient(135deg, #ff5f6d, #ffc371); }
        .bg-web { background: linear-gradient(135deg, #2193b0, #6dd5ed); }
        .bg-stock { background: linear-gradient(135deg, #00b09b, #96c93d); }
        .bg-shopper { background: linear-gradient(135deg, #8e44ad, #c39bd3); }
    </style>
</head>
<body>

<div class="container">
    <h1 class="main-title">Os melhores <span style="color:#f37021">produtos</span> para conquistar seu mercado</h1>

    <div class="desktop-row">
        <div style="width: 180px;">
            <div class="card-intelligence" onclick="activate(this)">
                <div class="icon-lg bg-sales">💼</div>
                <h6 class="fw-bold">Sales</h6>
                <p class="small text-muted mb-0">Prospecção de clientes.</p>
            </div>
        </div>
        <div style="width: 180px;">
            <div class="card-intelligence active" onclick="activate(this)">
                <div class="icon-lg bg-app">📱</div>
                <h6 class="fw-bold">App</h6>
                <p class="small text-muted mb-0">Desempenho do seu aplicativo.</p>
            </div>
        </div>
        <div style="width: 180px;">
            <div class="card-intelligence" onclick="activate(this)">
                <div class="icon-lg bg-web">🌐</div>
                <h6 class="fw-bold">Web</h6>
                <p class="small text-muted mb-0">Pesquisa de mercado e SEO.</p>
            </div>
        </div>
        <div style="width: 180px;">
            <div class="card-intelligence" onclick="activate(this)">
                <div class="icon-lg bg-stock">📊</div>
                <h6 class="fw-bold">Stock</h6>
                <p class="small text-muted mb-0">Investimentos baseados em dados.</p>
            </div>
        </div>
    </div>

    <div class="mobile-accordion d-md-none">
        <div class="mobile-accordion-item">
            <div class="accordion-header" onclick="toggleMob(this)">
                <span><i class="icon-lg bg-sales d-inline-flex" style="width:30px; height:30px; font-size:14px; margin:0 10px 0 0">💼</i> <b>Sales Intelligence</b></span>
                <span class="arrow">▼</span>
            </div>
            <div class="accordion-content">
                <p class="small text-muted">Informações detalhadas sobre prospecção.</p>
            </div>
        </div>
        </div>
</div>

<script>
    function activate(el) {
        document.querySelectorAll('.card-intelligence').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
    }

    function toggleMob(header) {
        const item = header.parentElement;
        const wasActive = item.classList.contains('active');
        document.querySelectorAll('.mobile-accordion-item').forEach(i => i.classList.remove('active'));
        if(!wasActive) item.classList.add('active');
    }
</script>

</body>
</html>
