<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagem com Zoom</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* Container principal */
        
        .hero {
            position: relative;
            width: 100%;
            height: 50vh;
            overflow: hidden;
        }
        /* Imagem no CSS */
        
        .hero::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e') no-repeat center center/cover;
            animation: zoom 20s infinite alternate ease-in-out;
            z-index: 1;
        }
        /* Efeito de zoom */
        
        @keyframes zoom {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.2);
            }
        }
        /* Conteúdo por cima */
        
        .content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            /* overlay */
        }
        /* Estilo do texto */
        
        .content h1 {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        
        .content p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        /* Botão */
        
        .btn {
            padding: 12px 25px;
            background: #ff4d00;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
        }
        
        .btn:hover {
            background: #cc3d00;
        }
    </style>
</head>

<body>

    <section class="hero">
        <div class="content">
            <h1>Bem-vindo ao Seu Site</h1>
            <p>Soluções modernas em websites e sistemas</p>
            <a href="#" class="btn">Saiba Mais</a>
        </div>
    </section>

</body>

</html>
