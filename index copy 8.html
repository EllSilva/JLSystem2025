<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microsoft 365 - GoDaddy Style</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      color: #111;
      background-color: #fff;
    }

    /* Submenu Topo */
    .subnav-link {
      color: #111;
      text-decoration: none;
      font-weight: 500;
      padding-bottom: 8px;
      font-size: 0.95rem;
    }
    .subnav-link.active {
      border-bottom: 3px solid #111;
      font-weight: 700;
    }
    .subnav-brand {
      font-weight: 800;
      font-size: 1.1rem;
      text-decoration: none;
      color: #111;
    }

    /* Card de Imagem */
    .banner-card {
      background-color: #d8c3b0;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      min-height: 380px;
    }
    
    .banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Caixa Flutuante Informativa */
    .floating-info-box {
      background-color: #fff;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      font-size: 0.85rem;
      line-height: 1.4;
      max-width: 320px;
      color: #333;
    }

    /* Título e Lista */
    .section-subtitle {
      letter-spacing: 1.5px;
      font-weight: 700;
      font-size: 0.8rem;
    }

    .main-title {
      font-size: 2.5rem;
      font-weight: 800;
      line-height: 1.15;
    }

    .feature-list {
      list-style: none;
      padding: 0;
    }
    
    .feature-list li {
      font-size: 1.05rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .feature-list i {
      font-size: 1.25rem;
    }

    .dashed-underline {
      text-decoration: underline dotted;
      text-underline-offset: 4px;
    }

    /* Botão Principal */
    .btn-godaddy-blue {
      background-color: #0076d6;
      color: white;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 6px;
      border: none;
      text-decoration: none;
      display: inline-block;
    }
    .btn-godaddy-blue:hover {
      background-color: #005cb8;
      color: white;
    }

    /* Avaliações */
    .stars-badge {
      background-color: #00b67a;
      color: white;
      padding: 4px 6px;
      display: inline-flex;
      gap: 2px;
      align-items: center;
    }

    .rating-text {
      font-size: 0.875rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div id="app">
    <!-- Sub-navegação Superior -->
    <header class="border-bottom py-3">
      <div class="container">
        <div class="d-flex align-items-center flex-wrap gap-4">
          <!-- Link na Marca/Título Principal -->
          <a :href="brandUrl" class="subnav-brand me-3">{{ brandTitle }}</a>
          
          <div class="d-flex gap-4 align-items-center flex-grow-1 overflow-auto">
            <!-- Links do Menu -->
            <a 
              v-for="(item, index) in navItems" 
              :key="index"
              :href="item.url" 
              class="subnav-link text-nowrap"
              :class="{ 'active': item.active }"
              @click="setActive(index)"
            >
              {{ item.label }}
              <i v-if="item.hasDropdown" class="bi bi-chevron-down ms-1" style="font-size: 0.75rem;"></i>
            </a>
          </div>
        </div>
      </div>
    </header>

    <!-- Seção Conteúdo Principal -->
    <main class="container py-5">
      <div class="row align-items-center g-5">
        
        <!-- Coluna da Esquerda: Imagem com Box Informativo -->
        <div class="col-lg-6 position-relative">
          <div class="banner-card d-flex align-items-center justify-content-center p-3">
            <img 
              :src="heroImage" 
              alt="Microsoft 365 Preview" 
              class="banner-img img-fluid rounded-3"
            >
          </div>

          <!-- Caixa Informativa -->
          <div class="floating-info-box position-absolute bottom-0 end-0 translate-middle-y me-3 d-none d-md-block">
            <p class="m-0">
              {{ infoText }}
              <strong class="d-block mt-1">{{ supportPhone }}</strong>
            </p>
          </div>
        </div>

        <!-- Coluna da Direita: Textos e CTA -->
        <div class="col-lg-6 ps-lg-4">
          <span class="section-subtitle text-uppercase text-secondary d-block mb-2">
            {{ sectionTag }}
          </span>

          <h1 class="main-title mb-4">
            {{ mainTitle }}
          </h1>

          <!-- Lista de Recursos com Ícones e Links Opcionais -->
          <ul class="feature-list mb-4">
            <li v-for="(feature, idx) in features" :key="idx">
              <i :class="feature.icon"></i>
              <span>
                <a v-if="feature.url" :href="feature.url" class="text-dark text-decoration-none">
                  <span :class="{ 'dashed-underline': feature.underlined }">
                    {{ feature.text }}
                  </span>
                </a>
                <span v-else :class="{ 'dashed-underline': feature.underlined }">
                  {{ feature.text }}
                </span>
              </span>
            </li>
          </ul>

          <!-- Botão de Ação com Link (CTA) -->
          <div class="mb-4">
            <a :href="ctaUrl" class="btn btn-godaddy-blue">
              {{ ctaButtonText }}
            </a>
          </div>

          <!-- Rodapé com Link para Avaliações -->
          <div class="d-flex align-items-center gap-2 flex-wrap">
            <div class="stars-badge">
              <i class="bi bi-star-fill text-white" v-for="n in 5" :key="n" style="font-size: 0.75rem;"></i>
            </div>
            <span class="rating-text">
              <strong>{{ ratingScore }}</strong> out of 5 stars based on {{ ratingCount }} reviews
              <a :href="reviewsUrl" class="text-dark fw-bold ms-1">View All</a>
            </span>
          </div>

        </div>

      </div>
    </main>
  </div>

  <!-- Vue.js 2 (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>

  <script>
    new Vue({
      el: '#app',
      data: {
        brandTitle: 'Email and Microsoft 365',
        brandUrl: '/email-microsoft-365', // URL para a página principal
        navItems: [
          { label: 'All Email Options', url: '/email-options', active: false },
          { label: 'Business Email', url: '/business-email', active: false },
          { label: 'Microsoft 365', url: '/microsoft-365', active: true },
          { label: 'GoDaddy App', url: '/godaddy-app', active: false },
          { label: 'Email Security', url: '/email-security', active: false },
          { label: 'More', url: '#', active: false, hasDropdown: true },
        ],
        heroImage: 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=800&q=80',
        infoText: 'Choose your plan, pick your email address, and create a sign-in to start using online and offline Microsoft tools. Our expert guides are here to help at',
        supportPhone: '+353 1 653 5976.',
        sectionTag: 'MICROSOFT® 365',
        mainTitle: 'Collaborate, create and connect with Microsoft 365.',
        features: [
          { icon: 'bi bi-star', text: 'Office 365 apps like Word, Excel, and Teams.', underlined: true, url: '/office-apps' },
          { icon: 'bi bi-envelope', text: 'Email that matches your domain.', underlined: true, url: '/domain-email' },
          { icon: 'bi bi-list-task', text: 'Simple setup and expert customer support.', underlined: true, url: '/support' }
        ],
        ctaButtonText: 'See Plans and Pricing',
        ctaUrl: '/plans-and-pricing', // URL do botão principal
        ratingScore: '4.4',
        ratingCount: '138,818',
        reviewsUrl: '/customer-reviews' // URL do link "View All"
      },
      methods: {
        setActive(selectedIndex) {
          this.navItems.forEach((item, index) => {
            item.active = index === selectedIndex;
          });
        }
      }
    });
  </script>
</body>
</html>
