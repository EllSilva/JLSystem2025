<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Projectos - Vue 2</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS do lightGallery -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.7.2/css/lightgallery.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.7.2/css/lg-zoom.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.7.2/css/lg-thumbnail.min.css" />

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }
        
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: inherit;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            color: inherit;
        }
        
        .badge-website {
            background-color: #0d6efd;
        }
        
        .badge-designer {
            background-color: #6f42c1;
        }
        
        .badge-portifolio {
            background-color: #198754;
        }
    </style>
</head>

<body>

    <div id="app" class="container py-5">
        <h1 class="text-center mb-4 fw-bold">Biblioteca de Projectos</h1>

        <!-- Botões de Filtro -->
        <div class="d-flex justify-content-center gap-2 mb-5 flex-wrap">
            <button v-for="cat in categorias" :key="cat.id" @click="filtroAtual = cat.id" :class="['btn', filtroAtual === cat.id ? 'btn-primary' : 'btn-outline-light']">
        {{ cat.nome }}
      </button>
        </div>

        <!-- Grelha de Projectos -->
        <div id="lightgallery" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">

            <div v-for="projecto in projectosFiltrados" :key="projecto.id" class="col">

                <!-- Caso 1: WEBSITE (Abre em nova página/aba) -->
                <a v-if="projecto.categoria === 'website'" :href="projecto.link" target="_blank" rel="noopener noreferrer" class="card h-100">
                    <img :src="projecto.imagem" class="card-img-top object-fit-cover" height="200" :alt="projecto.titulo">
                    <div class="card-body">
                        <span class="badge badge-website mb-2">Website</span>
                        <h5 class="card-title fw-bold">{{ projecto.titulo }}</h5>
                        <p class="card-text text-secondary small">{{ projecto.descricao }}</p>
                    </div>
                </a>

                <!-- Caso 2: DESIGNER ou PORTIFÓLIO (Abre no Modal com lightGallery) -->
                <a v-else :href="projecto.imagem" :data-sub-html="'<h4>' + projecto.titulo + '</h4><p>' + projecto.descricao + '</p>'" class="card h-100 gallery-item">
                    <img :src="projecto.imagem" class="card-img-top object-fit-cover" height="200" :alt="projecto.titulo">
                    <div class="card-body">
                        <span :class="['badge', 'mb-2', projecto.categoria === 'designer' ? 'badge-designer' : 'badge-portifolio']">
              {{ projecto.categoria === 'designer' ? 'Designer' : 'Portifólio' }}
            </span>
                        <h5 class="card-title fw-bold">{{ projecto.titulo }}</h5>
                        <p class="card-text text-secondary small">{{ projecto.descricao }}</p>
                    </div>
                </a>

            </div>

        </div>
    </div>

    <!-- Vue.js 2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>

    <!-- JS do lightGallery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.7.2/lightgallery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.7.2/plugins/zoom/lg-zoom.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightgallery/2.7.2/plugins/thumbnail/lg-thumbnail.min.js"></script>

    <script>
        new Vue({
            el: '#app',
            data: {
                filtroAtual: 'todos',
                lgInstance: null,
                categorias: [{
                    id: 'todos',
                    nome: 'Todos'
                }, {
                    id: 'website',
                    nome: 'Website'
                }, {
                    id: 'designer',
                    nome: 'Designer'
                }, {
                    id: 'portifolio',
                    nome: 'Portifólio'
                }],
                projectos: [{
                    id: 1,
                    titulo: 'Plataforma Barmi Energy',
                    categoria: 'website',
                    link: 'https://barmienergy.com',
                    imagem: 'https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=800&q=80',
                    descricao: 'Website empresarial. Clique para abrir numa nova página.'
                }, {
                    id: 2,
                    titulo: 'Design de Branding & Logo',
                    categoria: 'designer',
                    imagem: 'https://images.unsplash.com/photo-1626785774573-4b799315345d?auto=format&fit=crop&w=1200&q=80',
                    descricao: 'Identidade visual desenvolvida para marca corporativa.'
                }, {
                    id: 3,
                    titulo: 'Showcase de Trabalhos',
                    categoria: 'portifolio',
                    imagem: 'https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?auto=format&fit=crop&w=1200&q=80',
                    descricao: 'Apresentação detalhada de projectos anteriores.'
                }, {
                    id: 4,
                    titulo: 'Kianda Geo Solutions',
                    categoria: 'website',
                    link: 'https://kiandageosolutions.com',
                    imagem: 'https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=800&q=80',
                    descricao: 'Portal institucional e serviços geográficos.'
                }]
            },
            computed: {
                projectosFiltrados: function() {
                    if (this.filtroAtual === 'todos') {
                        return this.projectos;
                    }
                    var cat = this.filtroAtual;
                    return this.projectos.filter(function(p) {
                        return p.categoria === cat;
                    });
                }
            },
            methods: {
                initLightGallery: function() {
                    var container = document.getElementById('lightgallery');
                    if (!container) return;

                    // Destrói a instância anterior para evitar duplicados ao re-filtrar
                    if (this.lgInstance) {
                        this.lgInstance.destroy(true);
                    }

                    this.lgInstance = lightGallery(container, {
                        selector: '.gallery-item',
                        plugins: [lgZoom, lgThumbnail],
                        speed: 500
                    });
                }
            },
            watch: {
                filtroAtual: function() {
                    // Garante que o Vue atualiza os elementos no DOM antes de reinicializar a galeria
                    this.$nextTick(function() {
                        this.initLightGallery();
                    });
                }
            },
            mounted: function() {
                this.initLightGallery();
            }
        });
    </script>
</body>

</html>
