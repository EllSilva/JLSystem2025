<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Website</title>
  <style>
    body {
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .card {
      position: relative;
      width: 270px;
      height: 290px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .background {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom right, #6a00ffb3, #3300ccb3);
    }

    .content {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
    }

    .text {
      font-size: 16px;
      font-weight: bold;
    }

    .arrow {
      color: yellow;
      font-size: 20px;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="./assets/images/banner_marketing.jpg" alt="Background" class="background">
    <div class="overlay"></div>
    <div class="content">
      <span class="text">Criar Website</span>
      <span class="arrow">→</span>
    </div>
  </div>

</body>
</html>
