<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulação de Pacote de E-mails</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Fontes Google -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
         :root {
            --bg-color: #0a0a12;
            --card-bg: rgba(20, 20, 35, 0.7);
            --primary-color: #8b0000;
            --primary-glow: #ff0055;
            --secondary-color: #00ffcc;
            --text-color: #e2e8f0;
            --grid-line: rgba(0, 255, 204, 0.05);
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 40px 40px, 40px 40px;
        }
        
        .orbitron-font {
            font-family: 'Orbitron', sans-serif;
        }
        /* Banner Titulo */
        
        .banner-titulo {
            background-color: var(--primary-color);
            color: #ffffff;
            letter-spacing: 1.5px;
            box-shadow: 0 0 15px rgba(139, 0, 0, 0.5);
            border: 1px solid rgba(255, 0, 85, 0.3);
        }
        /* Cards Cyberpunk */
        
        .cyber-card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 255, 204, 0.2);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }
        
        .summary-card {
            background: rgba(15, 15, 28, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        /* Form Controls Customizados */
        
        .form-label {
            color: var(--text-color);
            letter-spacing: 0.5px;
        }
        
        .form-label i {
            color: var(--secondary-color);
        }
        
        .select-wrapper {
            position: relative;
        }
        
        .form-select-custom {
            background-color: rgba(10, 10, 18, 0.85);
            color: #fff;
            border: 1px solid var(--secondary-color);
            box-shadow: 0 0 5px rgba(0, 255, 204, 0.2);
            transition: all 0.3s ease;
        }
        
        .form-select-custom:focus {
            background-color: rgba(10, 10, 18, 0.95);
            color: #fff;
            border-color: var(--secondary-color);
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.5);
        }
        
        .form-select-custom option {
            background-color: #0a0a12;
            color: #fff;
        }
        /* Ícone de Check verde dentro do Select */
        
        .select-wrapper::after {
            content: "\f00c";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--secondary-color);
            pointer-events: none;
            font-size: 0.95rem;
        }
        /* Valores e Divisores */
        
        .summary-divider {
            height: 1px;
            background: rgba(0, 255, 204, 0.2);
        }
        
        .summary-total-value {
            color: var(--secondary-color);
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
        }
        /* Botão Customizado */
        
        .btn-cyber {
            background: var(--primary-color);
            color: #fff;
            border: 1px solid var(--primary-glow);
            box-shadow: 0 0 10px rgba(139, 0, 0, 0.5);
            transition: all 0.3s ease;
        }
        
        .btn-cyber:hover {
            background: var(--primary-glow);
            color: #fff;
            box-shadow: 0 0 20px var(--primary-glow);
            transform: translateY(-2px);
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center py-4">

    <div id="app" class="container my-auto" style="max-width: 950px;">
        <!-- Banner Superior com Ícone de Envelope -->
        <div class="banner-titulo orbitron-font text-center text-uppercase fw-bold p-3 rounded mb-4 d-flex align-items-center justify-content-center gap-2">
            <i class="fas fa-envelope-open-text"></i> Escolha abaixo o seu pacote de e-mails
        </div>

        <!-- Grid Responsivo do Bootstrap -->
        <div class="row g-4 align-items-start">
            <!-- Lado Esquerdo: Formulário com Ícones -->
            <div class="col-12 col-md-8">
                <div class="cyber-card p-4 rounded">
                    <div class="row g-3">
                        <!-- Campo Domínio -->
                        <div class="col-12 col-sm-6">
                            <label for="dominio" class="form-label orbitron-font fs-6 d-flex align-items-center gap-2">
                                <i class="fas fa-globe"></i> Escolha o domínio
                            </label>
                            <div class="select-wrapper">
                                <select id="dominio" class="form-select form-select-custom py-2 pe-5" v-model="dominioSelecionado">
                                    <option v-for="d in dominios" :key="d.nome" :value="d">
                                        {{ d.nome }}
                                    </option>
                                </select>
                            </div>
                        </div>

                        <!-- Campo Quantidade de E-mails -->
                        <div class="col-12 col-sm-6">
                            <label for="qtdEmail" class="form-label orbitron-font fs-6 d-flex align-items-center gap-2">
                                <i class="fas fa-users"></i> Escolha o nº de emails
                            </label>
                            <div class="select-wrapper">
                                <select id="qtdEmail" class="form-select form-select-custom py-2 pe-5" v-model.number="qtdEmail">
                                    <option v-for="qtd in [1, 5, 10, 15, 20, 25, 50]" :key="qtd" :value="qtd">
                                        {{ qtd }}
                                    </option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Lado Direito: Resumo com Botão Solicitar -->
            <div class="col-12 col-md-4">
                <div class="summary-card p-4 rounded shadow">
                    <div class="d-flex justify-content-between align-items-center mb-3 text-secondary">
                        <span>Subtotal</span>
                        <span class="fw-bold text-white">{{ formatarPreco(valorTotal) }}</span>
                    </div>

                    <div class="summary-divider my-3"></div>

                    <div class="d-flex justify-content-between align-items-center orbitron-font fs-6 text-white mb-4">
                        <span>Total</span>
                        <span class="summary-total-value fs-5 fw-bold">{{ formatarPreco(valorTotal) }}</span>
                    </div>

                    <button class="btn btn-cyber w-100 orbitron-font fw-bold py-2 text-uppercase d-flex align-items-center justify-content-center gap-2" @click="finalizarPedido">
                        <i class="fab fa-whatsapp"></i> Solicitar via WhatsApp
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Vue.js 2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>

    <script>
        new Vue({
            el: '#app',
            data: {
                precoPorEmail: 10000,
                qtdEmail: 5,
                dominioSelecionado: null,
                dominios: [{
                    nome: ".CO.AO",
                    preco: 22990
                }, {
                    nome: ".COM",
                    preco: 15000
                }, {
                    nome: ".ORG",
                    preco: 18000
                }, {
                    nome: ".AO",
                    preco: 30000
                }]
            },
            computed: {
                precoDominio() {
                    return this.dominioSelecionado ? this.dominioSelecionado.preco : 0;
                },
                totalEmails() {
                    return (this.qtdEmail || 0) * this.precoPorEmail;
                },
                valorTotal() {
                    return this.precoDominio + this.totalEmails;
                }
            },
            created() {
                this.dominioSelecionado = this.dominios[0];
            },
            methods: {
                formatarPreco(valor) {
                    return new Intl.NumberFormat('pt-AO', {
                        minimumFractionDigits: 2
                    }).format(valor) + ' Kz';
                },
                finalizarPedido() {
                    const numeroTelefone = "244952472527";
                    const mensagem = `Olá! Gostaria de solicitar o pacote de e-mails:\n\n` +
                        `*Domínio:* ${this.dominioSelecionado.nome}\n` +
                        `*Qtd de E-mails:* ${this.qtdEmail}\n` +
                        `*Total:* ${this.formatarPreco(this.valorTotal)}`;

                    const urlWhatsApp = `https://wa.me/${numeroTelefone}?text=${encodeURIComponent(mensagem)}`;
                    window.open(urlWhatsApp, '_blank');
                }
            }
        });
    </script>
</body>

</html>
