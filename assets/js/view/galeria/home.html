<div class="container">
    <header>
        <h1>Creative Lab</h1>
        <p style="color: var(--primary); letter-spacing: 2px;">GALERIA DE PROJETOS DO FUTURO</p>
    </header>

    <div class="filters">
        <button v-for="category in categories" :key="category" @click="currentFilter = category" :class="['filter-btn', { active: currentFilter === category }]">
                {{ category }}
            </button>
    </div>

    <transition-group name="gallery" tag="div" class="gallery-grid">
        <div class="project-card" v-for="project in filteredProjects" :key="project.id" @click="handleProjectClick(project)" style="transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);">
            <div class="card-img-wrapper">
                <img :src="project.image" :alt="project.title">
                <div class="card-overlay">
                    <button class="view-btn">
                            <i :class="project.category === 'Websites' ? 'fas fa-external-link-alt' : 'fas fa-images'"></i>
                            {{ project.category === 'Websites' ? 'Acessar Site' : 'Ver Galeria' }}
                        </button>
                </div>
            </div>
            <div class="card-content">
                <span class="project-tag">{{ project.category }}</span>
                <h3 class="project-title">{{ project.title }}</h3>
                <p class="project-desc">{{ project.description }}</p>
            </div>
        </div>
    </transition-group>
</div>
