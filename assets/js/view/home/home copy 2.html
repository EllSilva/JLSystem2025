<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angodigital - Vue.js 2 + Scroll Effect</title>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Vue.js 2 (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            background-color: #0b1120;
            color: #ffffff;
            overflow-x: hidden;
        }
        /* Hero Container */
        
        .hero-section {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            overflow: hidden;
        }
        /* Imagem de Fundo animada pelo Vue */
        
        .hero-bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1498050108023-c5249f4df085?q=80&w=1920&auto=format&fit=crop');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            /* Suavidade na transição de estilo */
            transition: transform 0.1s ease-out, opacity 0.1s ease-out;
            will-change: transform, opacity;
            z-index: 1;
        }
        /* Overlay Escuro / Glassmorphism */
        
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(10, 18, 30, 0.88), rgba(20, 35, 60, 0.82));
            backdrop-filter: blur(4px);
            z-index: 2;
        }
        /* Conteúdo Principal */
        
        .hero-container {
            position: relative;
            z-index: 3;
            max-width: 1100px;
            width: 100%;
            text-align: center;
        }
        /* Título */
        
        .hero-title {
            font-size: 2.8rem;
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 24px;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        /* Descrição */
        
        .hero-description {
            font-size: 1.05rem;
            font-weight: 300;
            line-height: 1.6;
            color: #cbd5e1;
            max-width: 900px;
            margin: 0 auto 60px auto;
        }
        /* Grid de Estatísticas */
        
        .stats-grid {
            display: flex;
            justify-content: center;
            align-items: stretch;
            flex-wrap: wrap;
            gap: 20px 0;
        }
        
        .stat-item {
            flex: 1;
            min-width: 200px;
            padding: 10px 20px;
            position: relative;
            transition: transform 0.3s ease;
        }
        
        .stat-item:hover {
            transform: translateY(-5px);
        }
        /* Linha divisória vertical */
        
        .stat-item:not(:last-child)::after {
            content: "";
            position: absolute;
            right: 0;
            top: 15%;
            height: 70%;
            width: 1px;
            background: rgba(255, 255, 255, 0.25);
        }
        /* Números e Rótulos */
        
        .stat-number {
            font-size: 3.5rem;
            font-weight: 300;
            color: #ffffff;
            line-height: 1;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }
        
        .stat-label {
            font-size: 0.95rem;
            font-weight: 400;
            color: #e2e8f0;
            line-height: 1.3;
        }
        /* Espaço para permitir a rolagem */
        
        .content-filler {
            height: 100vh;
            background-color: #0b1120;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
        }
        /* Responsividade */
        
        @media (max-width: 900px) {
            .hero-title {
                font-size: 2.1rem;
            }
            .hero-description {
                font-size: 0.95rem;
                margin-bottom: 40px;
            }
            .stat-number {
                font-size: 2.8rem;
            }
            .stat-item {
                flex: 1 1 45%;
                margin-bottom: 20px;
            }
            .stat-item:nth-child(2)::after {
                display: none;
            }
        }
        
        @media (max-width: 600px) {
            .hero-title {
                font-size: 1.6rem;
            }
            .hero-section {
                padding: 60px 15px;
            }
            .stat-item {
                flex: 1 1 100%;
            }
            .stat-item::after {
                display: none !important;
            }
        }
    </style>
</head>

<body>

    <!-- Elemento raiz montado pelo Vue.js -->
    <div id="app">
        <section class="hero-section">
            <!-- Binding reativo de estilo inline para o Zoom da imagem -->
            <div class="hero-bg-image" :style="bgStyle">
            </div>

            <!-- Overlay -->
            <div class="hero-overlay"></div>

            <!-- Conteúdo -->
            <div class="hero-container">
                <h1 class="hero-title" v-html="title"></h1>

                <p class="hero-description">
                    {{ description }}
                </p>

                <!-- Iteração dinâmica das estatísticas com v-for -->
                <div class="stats-grid">
                    <div class="stat-item" v-for="(stat, index) in stats" :key="index">
                        <div class="stat-number">{{ stat.number }}</div>
                        <div class="stat-label">{{ stat.label }}</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Área de teste de scroll -->
        <div class="content-filler">
            <h2>Role para baixo / cima para testar a reatividade do Vue.js com o scroll</h2>
        </div>
    </div>

    <!-- Script da Instância Vue.js 2 -->
    <script>
        new Vue({
            el: '#app',
            data: {
                scrollY: 0,
                title: 'Tomamos as decisões certas para impulsar o<br>seu crescimento digital',
                description: 'Na Angodigital, atuamos com estratégia, precisão e foco em resultados para oferecer soluções tecnológicas eficazes no momento certo. Ajudamos empresas a crescer, automatizar processos e destacar-se no mercado digital através de inovação e planeamento inteligente.',
                // Array de dados dinâmicos para as estatísticas
                stats: [{
                    number: '+500',
                    label: 'Negócios Transformados'
                }, {
                    number: '+750',
                    label: 'Soluções Digitais Criadas'
                }, {
                    number: '230',
                    label: 'Projectos Entregues'
                }, {
                    number: '100%',
                    label: 'Presença Digital'
                }]
            },
            computed: {
                // Propriedade computada que retorna os estilos reativos para a imagem
                bgStyle() {
                    const scaleValue = 1 + (this.scrollY * 0.0008);
                    const opacityValue = Math.max(1 - (this.scrollY * 0.001), 0.3);

                    return {
                        transform: `scale(${scaleValue})`,
                        opacity: opacityValue
                    };
                }
            },
            methods: {
                // Atualiza o estado scrollY com a posição atual da janela
                handleScroll() {
                    this.scrollY = window.scrollY;
                }
            },
            mounted() {
                // Adiciona o ouvinte de evento quando a instância do Vue for montada
                window.addEventListener('scroll', this.handleScroll);
            },
            beforeDestroy() {
                // Remove o ouvinte ao destruir o componente (boa prática de memória)
                window.removeEventListener('scroll', this.handleScroll);
            }
        });
    </script>

</body>

</html>
