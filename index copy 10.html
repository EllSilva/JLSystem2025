<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospedagem de Sites - HostGator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background-color: #0b0c10;
            color: #ffffff;
            overflow-x: hidden;
        }
        /* Hero Section com Fundo Dinâmico */
        
        .hero-container {
            position: relative;
            width: 100%;
            min-height: 520px;
            padding: 60px 8%;
            background: linear-gradient(135deg, rgba(10, 12, 20, 0.92), rgba(18, 22, 36, 0.88)), url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=1600') center/cover no-repeat;
            display: flex;
            align-items: center;
            overflow: hidden;
        }
        /* Animação de Rede/Grelha Tecnológica ao fundo */
        
        .hero-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background-image: radial-gradient(rgba(255, 92, 0, 0.15) 1px, transparent 0), linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px, 40px 40px, 40px 40px;
            animation: techGrid 20s linear infinite;
            pointer-events: none;
        }
        
        @keyframes techGrid {
            0% {
                transform: translate(0, 0);
            }
            100% {
                transform: translate(-50px, -50px);
            }
        }
        
        .hero-content {
            max-width: 650px;
            z-index: 2;
        }
        /* Tagline com Efeito Neon */
        
        .tagline {
            color: #ff5c00;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            animation: fadeIn 1s ease-in-out;
            text-shadow: 0 0 10px rgba(255, 92, 0, 0.5);
        }
        /* Efeito de Digitação Tech no Título */
        
        .title {
            font-size: 3.2rem;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 35px;
        }
        
        .typing-text {
            border-right: 3px solid #ff5c00;
            white-space: nowrap;
            overflow: hidden;
            display: inline-block;
            animation: typing 2.5s steps(20, end), blink 0.75s step-end infinite;
        }
        
        .title span {
            color: #ff5c00;
            display: block;
            text-shadow: 0 0 15px rgba(255, 92, 0, 0.4);
        }
        
        @keyframes typing {
            from {
                width: 0
            }
            to {
                width: 100%
            }
        }
        
        @keyframes blink {
            from,
            to {
                border-color: transparent
            }
            50% {
                border-color: #ff5c00;
            }
        }
        /* Grid de Benefícios Interativo */
        
        .features-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px 24px;
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            color: #d1d5db;
            padding: 8px 12px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: default;
        }
        
        .feature-item:hover {
            background: rgba(255, 92, 0, 0.1);
            border-color: rgba(255, 92, 0, 0.4);
            transform: translateX(6px);
            box-shadow: 0 4px 15px rgba(255, 92, 0, 0.2);
        }
        
        .checkmark {
            color: #ff5c00;
            font-weight: bold;
            transition: transform 0.3s ease;
        }
        
        .feature-item:hover .checkmark {
            transform: scale(1.3) rotate(10deg);
        }
        /* Badge Promocional Futurista com Pulso Neon */
        
        .badge-discount {
            position: absolute;
            right: 15%;
            bottom: 40px;
            background: linear-gradient(135deg, #ff6a00, #ff2a00);
            color: #ffffff;
            padding: 22px 28px;
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            text-align: center;
            transform: rotate(10deg);
            z-index: 3;
            animation: floatPulse 3s ease-in-out infinite alternate;
        }
        
        @keyframes floatPulse {
            0% {
                transform: rotate(10deg) translateY(0px);
                box-shadow: 0 0 15px rgba(255, 92, 0, 0.4), 0 0 30px rgba(255, 92, 0, 0.2);
            }
            100% {
                transform: rotate(7deg) translateY(-12px);
                box-shadow: 0 0 25px rgba(255, 92, 0, 0.8), 0 0 50px rgba(255, 92, 0, 0.4);
            }
        }
        
        .badge-discount .small-text {
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            display: block;
        }
        
        .badge-discount .percentage {
            font-size: 3rem;
            font-weight: 900;
            line-height: 0.85;
            margin: 6px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .badge-discount .off-text {
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 2px;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* Responsividade */
        
        @media (max-width: 900px) {
            .hero-container {
                padding-bottom: 140px;
            }
            .badge-discount {
                right: 8%;
                bottom: 20px;
            }
            .typing-text {
                white-space: normal;
                border-right: none;
                animation: none;
            }
        }
        
        @media (max-width: 600px) {
            .title {
                font-size: 2.2rem;
            }
            .features-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <section class="hero-container">
        <div class="hero-content">
            <p class="tagline">&#9889; ATÉ 79% OFF NA HOSPEDAGEM DE SITES</p>

            <h1 class="title">
                <span class="typing-text">Tudo para criar</span>
                <span>seu site</span>
            </h1>

            <div class="features-grid">
                <div class="feature-item">
                    <span class="checkmark">&#10003;</span>
                    <span>Ferramentas com IA para criar sites</span>
                </div>
                <div class="feature-item">
                    <span class="checkmark">&#10003;</span>
                    <span>Migração de sites grátis</span>
                </div>
                <div class="feature-item">
                    <span class="checkmark">&#10003;</span>
                    <span>Suporte em português 24h</span>
                </div>
                <div class="feature-item">
                    <span class="checkmark">&#10003;</span>
                    <span>Até 3 domínios grátis</span>
                </div>
            </div>
        </div>

        <!-- Badge Promocional Animado -->
        <div class="badge-discount">
            <span class="small-text">ATÉ</span>
            <div class="percentage">79%</div>
            <span class="off-text">OFF</span>
        </div>
    </section>

</body>

</html>
