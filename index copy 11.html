<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quem Somos - Empresa de Serviços</title>
    <!-- Fonte Google Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* --- RESET E ESTILOS GERAIS --- */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #ffffff;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        /* --- ESTRUTURA DA SECÇÃO --- */
        
        .about-section {
            width: 100%;
            padding: 80px 20px;
            display: flex;
            justify-content: center;
        }
        
        .container {
            max-width: 1100px;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 60px;
        }
        /* --- COLUNA DA ESQUERDA (IMAGEM) --- */
        
        .image-column {
            flex: 1;
            display: flex;
            justify-content: center;
        }
        
        .image-wrapper {
            position: relative;
            max-width: 420px;
            width: 100%;
        }
        /* Imagem Principal */
        
        .main-img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
            position: relative;
            z-index: 2;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        /* Fundo roxo suave atrás da imagem */
        
        .bg-shape-top {
            position: absolute;
            top: -25px;
            left: -25px;
            width: 120px;
            height: 120px;
            background-color: #e0e3fb;
            border-radius: 12px;
            z-index: 1;
        }
        /* Padrão pontilhado na base da imagem */
        
        .bg-dots {
            position: absolute;
            bottom: -30px;
            left: -35px;
            width: 180px;
            height: 180px;
            background-image: radial-gradient(#d0d5dd 2px, transparent 2px);
            background-size: 12px 12px;
            z-index: 1;
        }
        /* Badge Laranja/Gradiente "+17 Anos" */
        
        .experience-badge {
            position: absolute;
            bottom: 25px;
            right: -30px;
            background: linear-gradient(135deg, #ff9f38 0%, #ff4b3e 100%);
            color: #ffffff;
            padding: 25px 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(255, 75, 62, 0.3);
            z-index: 3;
            min-width: 140px;
        }
        
        .experience-badge .number {
            display: block;
            font-size: 38px;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 8px;
        }
        
        .experience-badge .text {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.3;
            display: block;
        }
        /* --- COLUNA DA DIREITA (CONTEÚDO) --- */
        
        .content-column {
            flex: 1.1;
        }
        
        .subtitle {
            color: #f37032;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: block;
            margin-bottom: 12px;
        }
        
        .title {
            color: #232323;
            font-size: 38px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 24px;
        }
        
        .description {
            color: #666666;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 35px;
            font-weight: 400;
        }
        /* Botão Contactos */
        
        .btn-contact {
            display: inline-block;
            background-color: #2b2b72;
            color: #ffffff;
            padding: 16px 36px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        
        .btn-contact:hover {
            background-color: #1e1e52;
            transform: translateY(-2px);
        }
        /* --- RESPONSIVIDADE (MOBILE / TABLET) --- */
        
        @media (max-width: 850px) {
            .container {
                flex-direction: column;
                gap: 50px;
                text-align: center;
            }
            .image-wrapper {
                max-width: 90%;
            }
            .experience-badge {
                right: 10px;
                bottom: -20px;
            }
            .title {
                font-size: 28px;
            }
            .content-column {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

<body>

    <section class="about-section">
        <div class="container">

            <!-- Coluna da Esquerda: Imagem e Badges -->
            <div class="image-column">
                <div class="image-wrapper">
                    <!-- Elemento decorativo de fundo roxo/azul claro -->
                    <div class="bg-shape-top"></div>

                    <!-- Elemento decorativo pontilhado de fundo -->
                    <div class="bg-dots"></div>

                    <!-- Imagem Principal -->
                    <img src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?q=80&w=800&auto=format&fit=crop" alt="Profissional a trabalhar" class="main-img">

                    <!-- Badge de Anos de Experiência -->
                    <div class="experience-badge">
                        <span class="number">+17</span>
                        <span class="text">Anos de<br>Experiência</span>
                    </div>
                </div>
            </div>

            <!-- Coluna da Direita: Conteúdo de Texto -->
            <div class="content-column">
                <span class="subtitle">QUEM SOMOS</span>
                <h2 class="title">Empresa de Serviços<br>e Marketing Online</h2>
                <p class="description">
                    Iniciamos a nossa atividade em Junho de 2007, selecionamos uma equipa jovem e dinâmica mas ao mesmo tempo com mais de 25 anos de experiência na área de relações públicas, comercialização e gestão de imagem.
                </p>
                <a href="#contactos" class="btn-contact">CONTACTOS</a>
            </div>

        </div>
    </section>

</body>

</html>
