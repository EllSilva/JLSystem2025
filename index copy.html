<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <style>
        .lista-limpa {
            list-style: none; /* Remove as bolinhas padrão */
            padding: 0;
            max-width: 300px;
        }

        .lista-limpa li {
            background: #ffffff; 
            display: flex;
            align-items: center;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        /* Adiciona um ícone antes do texto usando CSS */
        .lista-limpa li::before {
            content: "•";
            color: #3498db;
            font-weight: bold;
            margin-right: 10px;
            font-size: 1.5em;
        }

       
    </style>
</head>
<body>

    <ul class="lista-limpa">
        <li>Item número um</li>
        <li>Item número dois</li>
        <li>Item número três</li>
        <li>Item número quatro</li>
    </ul>

</body>
</html>
