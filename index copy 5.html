<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Projetos Cyberpunk</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- RESET & VARIÁVEIS --- */
        :root {
            --bg-color: #0a0a12;
            --card-bg: rgba(20, 20, 35, 0.7);
            --primary: #00ffcc;
            --secondary: #ff007f;
            --text: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 204, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 0, 127, 0.05) 0%, transparent 40%);
        }

        /* --- LAYOUT & HEADER --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary);
            margin-bottom: 10px;
        }

        /* --- FILTROS --- */
        .filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 8px 25px;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 5px rgba(0, 255, 204, 0.2);
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--primary);
            color: var(--bg-color);
            box-shadow: 0 0 20px var(--primary);
            transform: translateY(-3px);
        }

        /* --- CONTÊINER DO SLIDER (3 POR LINHA) --- */
        .slider-wrapper {
            position: relative;
            max-width: 100%; /* Expandido para caber os 3 cards confortavelmente */
            margin: 0 auto 40px auto;
            padding: 0 10px;
        }

        .slider-container {
            overflow: hidden;
            border-radius: 12px;
            position: relative;
        }

        .slider-track {
            display: flex;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .slider-item {
            /* Cada item ocupa exatamente 1/3 da linha */
            min-width: 33.333%; 
            box-sizing: border-box;
            padding: 15px; /* Espaçamento entre os cards */
        }

        /* Responsividade para telas menores */
        @media (max-width: 992px) {
            .slider-item { min-width: 50%; } /* 2 por linha em tablets */
        }
        @media (max-width: 650px) {
            .slider-item { min-width: 100%; } /* 1 por linha em celulares */
        }

        /* --- BOTÕES DO SLIDER --- */
        .slider-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(10, 10, 18, 0.9);
            border: 2px solid var(--primary);
            color: var(--primary);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            z-index: 10;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }

        .slider-arrow:hover {
            background: var(--primary);
            color: var(--bg-color);
            box-shadow: 0 0 20px var(--primary);
        }

        .slider-arrow.prev { left: -30px; }
        .slider-arrow.next { right: -30px; }

        @media (max-width: 1250px) {
            .slider-arrow.prev { left: 5px; }
            .slider-arrow.next { right: 5px; }
        }

        /* --- INDICADORES (DOTS) --- */
        .slider-dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dot.active {
            background: var(--secondary);
            box-shadow: 0 0 10px var(--secondary);
            transform: scale(1.2);
        }

        /* --- CARD INSANO --- */
        .project-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            height: 100%; /* Garante altura igual entre os cards */
            display: flex;
            flex-direction: column;
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 12px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .project-card:hover {
            transform: translateY(-5px);
            border-color: transparent;
            box-shadow: 0 15px 30px rgba(0, 255, 204, 0.2);
        }

        .project-card:hover::before { opacity: 1; }

        .card-img-wrapper {
            position: relative;
            height: 200px;
            overflow: hidden;
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.7s ease;
        }

        .project-card:hover .card-img-wrapper img {
            transform: scale(1.15) rotate(2deg);
        }

        .card-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 18, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .project-card:hover .card-overlay { opacity: 1; }

        .view-btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 12px 25px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transform: translateY(20px);
            transition: all 0.4s ease;
        }

        .project-card:hover .view-btn {
            transform: translateY(0);
            box-shadow: 0 0 15px var(--secondary);
        }

        .card-content {
            padding: 25px;
            background: var(--card-bg);
            flex-grow: 1; /* Faz o conteúdo preencher o espaço restante */
        }

        .project-tag {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--secondary);
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 8px;
            display: inline-block;
        }

        .project-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            color: #fff;
            margin-bottom: 10px;
        }

        .project-desc {
            font-size: 0.95rem;
            color: #a0aec0;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div id="app" class="container">
        <header>
            <h1>Creative Lab</h1>
            <p style="color: var(--primary); letter-spacing: 2px;">GALERIA DE PROJETOS DO FUTURO</p>
        </header>

        <div class="filters">
            <button 
                v-for="category in categories" 
                :key="category"
                @click="changeFilter(category)"
                :class="['filter-btn', { active: currentFilter === category }]"
            >
                {{ category }}
            </button>
        </div>

        <div class="slider-wrapper" v-if="filteredProjects.length > 0">
            
            <button class="slider-arrow prev" @click="prevSlide" v-if="filteredProjects.length > cardsPerView">
                <i class="fas fa-chevron-left"></i>
            </button>

            <div class="slider-container">
                <div class="slider-track" :style="{ transform: `translateX(-${currentSlide * (100 / cardsPerView)}%)` }">
                    
                    <div class="slider-item" v-for="project in filteredProjects" :key="project.id">
                        <div class="project-card">
                            <div class="card-img-wrapper">
                                <img :src="project.image" :alt="project.title">
                                <div class="card-overlay">
                                    <button class="view-btn"><i class="fas fa-bolt"></i> Inspecionar</button>
                                </div>
                            </div>
                            <div class="card-content">
                                <span class="project-tag">{{ project.category }}</span>
                                <h3 class="project-title">{{ project.title }}</h3>
                                <p class="project-desc">{{ project.description }}</p>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <button class="slider-arrow next" @click="nextSlide" v-if="filteredProjects.length > cardsPerView">
                <i class="fas fa-chevron-right"></i>
            </button>

            <div class="slider-dots" v-if="maxSteps > 0">
                <span 
                    v-for="index in (maxSteps + 1)" 
                    :key="'dot-' + index" 
                    :class="['dot', { active: (index - 1) === currentSlide }]"
                    @click="currentSlide = (index - 1)"
                ></span>
            </div>

        </div>
        
        <div v-else style="text-align: center; color: var(--secondary); font-weight: bold;">
            NENHUM PROJETO ENCONTRADO NO BANCO DE DADOS.
        </div>

    </div>

    <script>
        new Vue({
            el: '#app',
            data: {
                currentFilter: 'Todos',
                currentSlide: 0,
                cardsPerView: 3, // Define dinamicamente o número de arquivos visíveis por linha
                categories: ['Todos', 'Web', 'Mobile', 'AI & Cyber'],
                projects: [
                    {
                        id: 1,
                        title: 'Hyperion Portal',
                        category: 'Web',
                        description: 'Interface web descentralizada com renderização 3D em tempo real para cripto-ativos.',
                        image: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80'
                    },
                    {
                        id: 2,
                        title: 'NeuraLink App',
                        category: 'Mobile',
                        description: 'Aplicativo conceitual mobile para monitoramento de impulsos cerebrais e Machine Learning.',
                        image: 'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=600&q=80'
                    },
                    {
                        id: 3,
                        title: 'Quantum Core',
                        category: 'AI & Cyber',
                        description: 'Sistema de IA autônomo focado em criptografia quântica e defesa cibernética.',
                        image: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=600&q=80'
                    },
                    {
                        id: 4,
                        title: 'Aether HUD',
                        category: 'Web',
                        description: 'Painel de controle futurista construído inteiramente com micro-interações em CSS e Canvas.',
                        image: 'https://images.unsplash.com/photo-1614064641938-3bbee52942c7?auto=format&fit=crop&w=600&q=80'
                    },
                    {
                        id: 5,
                        title: 'Apex Runner',
                        category: 'Mobile',
                        description: 'Jogo mobile baseado em geolocalização com mecânicas imersivas de Realidade Aumentada.',
                        image: 'https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=600&q=80'
                    },
                    {
                        id: 6,
                        title: 'Synth Brain',
                        category: 'AI & Cyber',
                        description: 'Algoritmo preditivo de arte generativa que lê e interpreta dados meteorológicos mundiais.',
                        image: 'https://images.unsplash.com/photo-1620712943543-bcc4688e7485?auto=format&fit=crop&w=600&q=80'
                    }
                ]
            },
            computed: {
                filteredProjects() {
                    if (this.currentFilter === 'Todos') {
                        return this.projects;
                    }
                    return this.projects.filter(project => project.category === this.currentFilter);
                },
                // Calcula o limite máximo que o slider pode correr para não mostrar um espaço vazio no final
                maxSteps() {
                    const steps = this.filteredProjects.length - this.cardsPerView;
                    return steps > 0 ? steps : 0;
                }
            },
            methods: {
                nextSlide() {
                    if (this.currentSlide < this.maxSteps) {
                        this.currentSlide++;
                    } else {
                        this.currentSlide = 0; // Volta para o início
                    }
                },
                prevSlide() {
                    if (this.currentSlide > 0) {
                        this.currentSlide--;
                    } else {
                        this.currentSlide = this.maxSteps; // Vai para o fim válido
                    }
                },
                changeFilter(category) {
                    this.currentFilter = category;
                    this.currentSlide = 0; // Reseta o slider ao trocar categorias
                }
            },
            mounted() {
                // Monitora a largura da tela para ajustar a quantidade de arquivos por linha dinamicamente
                const updateCardsPerView = () => {
                    if (window.innerWidth <= 650) this.cardsPerView = 1;
                    else if (window.innerWidth <= 992) this.cardsPerView = 2;
                    else this.cardsPerView = 3;
                };
                window.addEventListener('resize', updateCardsPerView);
                updateCardsPerView();
            }
        });
    </script>
</body>
</html>
